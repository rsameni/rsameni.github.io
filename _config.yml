# ---------------------------------------------------------------------------
# sameni.info — site configuration
# Self-contained layout (no external theme). Works with both GitHub Pages
# build modes: the Actions workflow (.github/workflows/jekyll.yml) and the
# classic "Deploy from branch" builder.
# ---------------------------------------------------------------------------

title: Reza Sameni
description: >-
  Reza Sameni is an Associate Professor of Biomedical Informatics at Emory
  University working on biomedical signal processing, model-based machine
  learning, and medical informatics.
lang: en

# Custom domain. The CNAME file in the repo root must keep saying "sameni.info".
url: "https://sameni.info"
baseurl: ""

author:
  name: Reza Sameni
  email: rsameni@dbmi.emory.edu
  url: "https://sameni.info"

# Used by jekyll-seo-tag for structured data (sameAs profiles).
social:
  name: Reza Sameni
  links:
    - "https://scholar.google.com/citations?user=MkoXtWwAAAAJ"
    - "https://github.com/rsameni"
    - "https://www.linkedin.com/in/reza-sameni/"
    - "https://sameni.org"

# ---------------------------------------------------------------------------
# Navigation — pages listed here appear in the header, in this order.
# Pages without a title (e.g. index.md) are skipped. Pages that use
# `redirect_to:` link straight to their destination.
# ---------------------------------------------------------------------------
header_pages:
  - teaching.md
  - research.md
  - publications.md
  - team.md
#  - supervisions.md
#  - research_pool.md
#  - resources.md
#  - ethics.md

# ---------------------------------------------------------------------------
# Profile links (homepage + footer). `icon` must be one of:
# mail, lab, scholar, github, linkedin, orcid
# ---------------------------------------------------------------------------
social_links:
  - { label: "Email",            icon: mail,     url: "mailto:rsameni@dbmi.emory.edu" }
  - { label: "Alphanumerics Lab", icon: lab,     url: "https://sameni.org" }
  - { label: "Google Scholar",   icon: scholar,  url: "https://scholar.google.com/citations?user=MkoXtWwAAAAJ" }
  - { label: "GitHub",           icon: github,   url: "https://github.com/rsameni" }
  - { label: "LinkedIn",         icon: linkedin, url: "https://www.linkedin.com/in/reza-sameni/" }
#  - { label: "ORCID",           icon: orcid,    url: "https://orcid.org/0000-0003-4913-6825" }

# Google Analytics. Only GA4 IDs ("G-XXXXXXX") are emitted. The old
# Universal Analytics ID below stopped collecting data in July 2023, so it is
# kept for reference but ignored. Replace it with a GA4 ID to re-enable.
google_analytics: UA-2117082-4

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

# Never list CNAME here — it has to be copied into the built site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .editorconfig
  - .jekyll-cache/
  - .sass-cache/
  - vendor/
  - node_modules/
